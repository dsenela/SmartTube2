name: Build Custom Branch APK

on:
  push:
    branches: [ "claude/repo-analysis-HoL6c" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Extract and Calculate Version
        id: get_version
        run: |
          BASE_VERSION_CODE=$(grep "versionCode" smarttubetv/build.gradle | head -n 1 | grep -o '[0-9]\+')
          echo "VERSION_CODE=$((BASE_VERSION_CODE * 100000 + ${{ github.run_number }}))" >> $GITHUB_OUTPUT
          BASE_VERSION_NAME=$(grep "versionName" smarttubetv/build.gradle | head -n 1 | awk '{print $2}' | tr -d '"' | tr -d "'")
          echo "VERSION_NAME=${BASE_VERSION_NAME}-custom-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Bump Version
        uses: chkfung/android-version-actions@v1.2.3
        with:
          gradlePath: smarttubetv/build.gradle
          versionCode: ${{ steps.get_version.outputs.VERSION_CODE }}
          versionName: ${{ steps.get_version.outputs.VERSION_NAME }}

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean assembleStbetaRelease

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v6
        with:
          name: SmartTube_${{ steps.get_version.outputs.VERSION_NAME }}_arm64
          path: ./smarttubetv/build/outputs/apk/stbeta/release/*_arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v6
        with:
          name: SmartTube_${{ steps.get_version.outputs.VERSION_NAME }}_armeabi-v7a
          path: ./smarttubetv/build/outputs/apk/stbeta/release/*_armeabi-v7a-release.apk
          if-no-files-found: error

      - name: Upload x86 APK
        uses: actions/upload-artifact@v6
        with:
          name: SmartTube_${{ steps.get_version.outputs.VERSION_NAME }}_x86
          path: ./smarttubetv/build/outputs/apk/stbeta/release/*_x86-release.apk
          if-no-files-found: error

      - name: Create Release Summary
        run: |
          echo "### 🎉 Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.get_version.outputs.VERSION_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Changes:**" >> $GITHUB_STEP_SUMMARY
          echo "- Home section filtered to show only 3 rows:" >> $GITHUB_STEP_SUMMARY
          echo "  1. Recently Uploaded" >> $GITHUB_STEP_SUMMARY
          echo "  2. Recommended" >> $GITHUB_STEP_SUMMARY
          echo "  3. New to you" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Download APKs from the Artifacts section above** ⬆️" >> $GITHUB_STEP_SUMMARY
